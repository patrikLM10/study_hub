<header class="h-16 bg-surface-900/80 backdrop-blur-sm border-b border-surface-800 flex items-center justify-between px-4 lg:px-6 shrink-0">
    <div class="flex items-center gap-3">
        <button @click="mobileMenuOpen = !mobileMenuOpen" class="lg:hidden p-2 rounded-lg hover:bg-surface-800 text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="text-lg font-semibold text-white" x-text="pageTitle || 'Dashboard'"></h1>
    </div>
    <div class="flex items-center gap-3">
        <a href="/search" class="p-2 rounded-lg hover:bg-surface-800 text-slate-400" title="Search (Ctrl+K)">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </a>
        <template x-if="user">
            <div class="flex items-center gap-2">
                <span class="text-sm text-slate-400 hidden sm:inline" x-text="user.name"></span>
                <div class="w-8 h-8 rounded-full bg-accent-500/20 flex items-center justify-center text-accent-400 text-sm font-medium" x-text="user.name?.charAt(0)?.toUpperCase()"></div>
            </div>
        </template>
        <template x-if="!user">
            <a href="/login" class="btn btn-primary text-sm py-1.5 px-3">Sign In</a>
        </template>
    </div>
</header>
