{% extends "layouts/base.html" %}
{% block title %}Quizzes - {{ app_name }}{% endblock %}
{% block content %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('quizzesPage', () => ({
            quizzes: [],
            loading: true,
            async init() {
                this.pageTitle = 'Quizzes';
                if (!supabase) { this.loading = false; return; }
                const { data } = await supabase.from('quizzes').select('id, title, description, quiz_type, questions, time_limit, created_at').order('created_at', { ascending: false });
                this.quizzes = (data || []).map(q => ({ ...q, question_count: q.questions?.length || 0 }));
                this.loading = false;
            }
        }));
    });
</script>
<div x-data="quizzesPage()" x-init="init()">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold text-white">Quizzes</h2>
    </div>
    <template x-if="loading"><p class="text-slate-400">Loading...</p></template>
    <template x-if="!loading && quizzes.length === 0">
        <div class="text-center py-12 text-slate-400">
            <p>No quizzes yet. Generate them using OpenCode.</p>
        </div>
    </template>
    <div class="grid gap-3">
        <template x-for="quiz in quizzes" :key="quiz.id">
            <a :href="'/quiz/' + quiz.id" class="card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="font-medium text-slate-200" x-text="quiz.title"></p>
                        <p class="text-sm text-slate-400 mt-1" x-text="quiz.description || ''"></p>
                        <div class="flex items-center gap-3 mt-2 text-xs text-slate-500">
                            <span class="badge" :class="quiz.quiz_type === 'exam' ? 'badge-amber' : 'badge-primary'" x-text="quiz.quiz_type"></span>
                            <span x-text="quiz.question_count + ' questions'"></span>
                            <template x-if="quiz.time_limit">
                                <span x-text="quiz.time_limit + ' min'"></span>
                            </template>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </div>
            </a>
        </template>
    </div>
</div>
{% endblock %}
