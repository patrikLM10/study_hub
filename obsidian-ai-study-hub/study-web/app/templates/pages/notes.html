{% extends "layouts/base.html" %}
{% block title %}Notes - {{ app_name }}{% endblock %}
{% block content %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('notesPage', () => ({
            notes: [],
            loading: true,
            search: '',
            async init() {
                this.pageTitle = 'Notes';
                if (!supabase) { this.loading = false; return; }
                const { data } = await supabase.from('notes').select('id, title, slug, updated_at, tags, word_count').order('updated_at', { ascending: false });
                this.notes = (data || []).map(n => { if (typeof n.tags === 'string') n.tags = JSON.parse(n.tags); return n; });
                this.loading = false;
            },
            get filtered() {
                if (!this.search) return this.notes;
                const q = this.search.toLowerCase();
                return this.notes.filter(n => n.title.toLowerCase().includes(q));
            }
        }));
    });
</script>
<div x-data="notesPage()" x-init="init()">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold text-white">All Notes</h2>
        <div class="relative">
            <input type="text" x-model="search" placeholder="Filter notes..." class="w-64 bg-surface-800 border border-surface-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-accent-500">
        </div>
    </div>
    <template x-if="loading"><p class="text-slate-400 text-sm">Loading...</p></template>
    <template x-if="!loading && filtered.length === 0">
        <div class="text-center py-12 text-slate-400">
            <p>No notes found. Generate content using OpenCode.</p>
        </div>
    </template>
    <div class="grid gap-3">
        <template x-for="note in filtered" :key="note.id">
            <a :href="'/notes/' + note.id" class="card flex items-center justify-between">
                <div>
                    <p class="font-medium text-slate-200" x-text="note.title"></p>
                    <div class="flex items-center gap-3 mt-1 text-xs text-slate-500">
                        <span x-text="note.word_count + ' words'"></span>
                        <span x-text="timeAgo(note.updated_at)"></span>
                    </div>
                    <div class="flex gap-1 mt-2">
                        <template x-for="tag in (note.tags || [])" :key="tag">
                            <span class="tag" x-text="tag"></span>
                        </template>
                    </div>
                </div>
                <svg class="w-5 h-5 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </a>
        </template>
    </div>
</div>
{% endblock %}
