{% extends "layouts/base.html" %}
{% block title %}Authenticating... - {{ app_name }}{% endblock %}
{% block content %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('authCallback', () => ({
            init() {
                this.pageTitle = 'Authenticating';
                if (supabase) {
                    supabase.auth.onAuthStateChange((event, session) => {
                        if (session) window.location.href = '/';
                    });
                }
            }
        }));
    });
</script>
<div class="text-center py-12" x-data="authCallback()">
    <p class="text-slate-400">Authenticating...</p>
</div>
{% endblock %}
