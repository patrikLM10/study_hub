{% extends "layouts/base.html" %}
{% block title %}Search - {{ app_name }}{% endblock %}
{% block content %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('searchPage', () => ({
            query: '',
            results: [],
            searched: false,
            loading: false,
            async search() {
                if (!this.query.trim() || !supabase) return;
                this.loading = true;
                this.searched = true;
                const q = `%${this.query}%`;
                const { data } = await supabase.from('notes')
                    .select('id, title, slug, content, tags, updated_at')
                    .or(`title.ilike.${q},content.ilike.${q}`)
                    .limit(20);
                this.results = data || [];
                this.loading = false;
            }
        }));
    });
</script>
<div x-data="searchPage()">
    <h2 class="text-xl font-semibold text-white mb-6">Search Notes</h2>
    <div class="flex gap-2 mb-6">
        <input type="text" x-model="query" @keydown.enter="search" placeholder="Search notes..." class="flex-1 bg-surface-800 border border-surface-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-accent-500">
        <button @click="search" class="btn btn-primary">Search</button>
    </div>
    <template x-if="loading"><p class="text-slate-400 text-sm">Searching...</p></template>
    <template x-if="searched && !loading && results.length === 0">
        <p class="text-slate-400 text-sm">No results found.</p>
    </template>
    <div class="space-y-3">
        <template x-for="note in results" :key="note.id">
            <a :href="'/notes/' + note.id" class="card">
                <p class="font-medium text-slate-200" x-text="note.title"></p>
                <p class="text-sm text-slate-400 mt-1 line-clamp-2" x-text="note.content?.substring(0, 200)"></p>
                <div class="flex gap-2 mt-2">
                    <template x-for="tag in (note.tags || [])" :key="tag">
                        <span class="tag" x-text="tag"></span>
                    </template>
                </div>
            </a>
        </template>
    </div>
</div>
{% endblock %}
