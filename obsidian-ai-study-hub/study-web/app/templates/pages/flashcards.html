{% extends "layouts/base.html" %}
{% block title %}Flashcards - {{ app_name }}{% endblock %}
{% block content %}
<script>
    document.addEventListener('alpine:init', function () {
        Alpine.data('flashcardsPage', function () {
            return {
                cards: [],
                index: 0,
                flipped: false,
                loading: true,
                difficulty: 'all',
                async init() {
                    this.pageTitle = 'Flashcards';
                    if (!supabase) { this.loading = false; return; }
                    await this.loadCards();
                },
                async loadCards() {
                    this.loading = true;
                    var query = supabase.from('flashcards').select('*, notes!inner(title, slug)');
                    if (this.difficulty !== 'all') query = query.eq('difficulty', this.difficulty);
                    var result = await query.order('created_at', { ascending: false });
                    this.cards = result.data || [];
                    this.index = 0;
                    this.flipped = false;
                    this.loading = false;
                    Alpine.nextTick(function () { renderMath(); });
                },
                get current() { return this.cards[this.index]; },
                nextCard() {
                    if (this.index < this.cards.length - 1) { this.index++; this.flipped = false; }
                    Alpine.nextTick(function () { renderMath(); });
                },
                prevCard() {
                    if (this.index > 0) { this.index--; this.flipped = false; }
                    Alpine.nextTick(function () { renderMath(); });
                },
                flip() {
                    this.flipped = !this.flipped;
                    Alpine.nextTick(function () { renderMath(); });
                },
                shuffle() {
                    for (var i = this.cards.length - 1; i > 0; i--) {
                        var j = Math.floor(Math.random() * (i + 1));
                        var tmp = this.cards[i];
                        this.cards[i] = this.cards[j];
                        this.cards[j] = tmp;
                    }
                    this.index = 0;
                    this.flipped = false;
                    Alpine.nextTick(function () { renderMath(); });
                }
            };
        });
    });
</script>
<div x-data="flashcardsPage()" x-init="init()">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold text-white">Flashcards</h2>
        <div class="flex gap-2">
            <select x-model="difficulty" @change="loadCards()" class="bg-surface-800 border border-surface-700 rounded-lg px-3 py-1.5 text-sm text-slate-200">
                <option value="all">All</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
            <button @click="shuffle" class="btn btn-secondary text-sm">Shuffle</button>
        </div>
    </div>
    <template x-if="loading"><p class="text-slate-400">Loading...</p></template>
    <template x-if="!loading && cards.length === 0">
        <div class="text-center py-12 text-slate-400">
            <p>No flashcards. Generate them using OpenCode.</p>
        </div>
    </template>
    <template x-if="current">
        <div class="max-w-2xl mx-auto">
            <div class="text-center text-sm text-slate-500 mb-4"><span x-text="(index + 1) + ' of ' + cards.length"></span></div>
            <div class="card min-h-[200px] cursor-pointer" @click="flip">
                <div x-show="!flipped" class="flex items-center justify-center min-h-[180px]">
                    <p class="text-lg text-slate-200 text-center" x-text="current.question"></p>
                </div>
                <div x-show="flipped" class="flex items-center justify-center min-h-[180px]">
                    <p class="text-lg text-slate-200 text-center" x-text="current.answer"></p>
                </div>
                <div class="mt-4 text-center text-xs text-slate-500">
                    <span x-show="!flipped">Click to reveal answer</span>
                    <span x-show="flipped">Click to hide</span>
                </div>
            </div>
            <div class="flex justify-center gap-4 mt-6">
                <button @click="prevCard" :disabled="index === 0" class="btn btn-secondary text-sm" :class="{ 'opacity-50': index === 0 }">Previous</button>
                <button @click="nextCard" :disabled="index === cards.length - 1" class="btn btn-primary text-sm" :class="{ 'opacity-50': index === cards.length - 1 }">Next</button>
            </div>
        </div>
    </template>
</div>
{% endblock %}
