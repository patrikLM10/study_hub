{% extends "layouts/base.html" %}
{% block title %}Note - {{ app_name }}{% endblock %}
{% block content %}
<script>
    document.addEventListener('alpine:init', function () {
        Alpine.data('noteDetail', function () {
            return {
                note: null,
                flashcards: [],
                mcqs: [],
                loading: true,
                tab: 'content',
                async init() {
                    this.pageTitle = 'Note';
                    if (!supabase) { this.loading = false; return; }
                    var result = await supabase.from('notes').select('*').eq('id', '{{ note_id }}').single();
                    var note = result.data;
                    this.note = note;
                    if (note) {
                        if (typeof note.tags === 'string') note.tags = JSON.parse(note.tags);
                        var fcResult = await supabase.from('flashcards').select('*').eq('note_id', note.id);
                        var mcqResult = await supabase.from('mcqs').select('*').eq('note_id', note.id);
                        this.flashcards = (fcResult.data || []).map(function (f) {
                            if (typeof f.tags === 'string') f.tags = JSON.parse(f.tags);
                            return f;
                        });
                        this.mcqs = (mcqResult.data || []).map(function (m) {
                            if (typeof m.options === 'string') m.options = JSON.parse(m.options);
                            return m;
                        });
                    }
                    this.loading = false;
                    Alpine.nextTick(function () { renderMath(); });
                },
                switchTab(t) {
                    this.tab = t;
                    Alpine.nextTick(function () { renderMath(); });
                },
                toggleFlashcard(fc) {
                    fc._show = !fc._show;
                    Alpine.nextTick(function () { renderMath(); });
                },
                selectAnswer(mcq, opt) {
                    mcq._selected = opt;
                    mcq._show = true;
                    Alpine.nextTick(function () { renderMath(); });
                }
            };
        });
    });
</script>
<div x-data="noteDetail()" x-init="init()">
    <template x-if="loading"><p class="text-slate-400">Loading...</p></template>
    <template x-if="!loading && !note">
        <p class="text-slate-400">Note not found.</p>
    </template>
    <template x-if="note">
        <div>
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-white" x-text="note.title"></h1>
                <div class="flex gap-2 mt-2">
                    <template x-for="tag in (note.tags || [])" :key="tag">
                        <span class="tag" x-text="tag"></span>
                    </template>
                </div>
            </div>
            <div class="flex gap-2 mb-6">
                <button @click="switchTab('content')" :class="tab==='content' ? 'btn-primary' : 'btn-secondary'" class="btn text-sm">Content</button>
                <button @click="switchTab('flashcards')" :class="tab==='flashcards' ? 'btn-primary' : 'btn-secondary'" class="btn text-sm">Flashcards (<span x-text="flashcards.length"></span>)</button>
                <button @click="switchTab('mcqs')" :class="tab==='mcqs' ? 'btn-primary' : 'btn-secondary'" class="btn text-sm">MCQs (<span x-text="mcqs.length"></span>)</button>
            </div>
            <div x-show="tab==='content'" class="card prose max-w-none">
                <p class="text-slate-300 whitespace-pre-wrap" x-text="note.content"></p>
            </div>
            <div x-show="tab==='flashcards'" class="space-y-3">
                <template x-for="fc in flashcards" :key="fc.id">
                    <div class="card">
                        <p class="text-sm font-medium text-slate-200 mb-2" x-text="fc.question"></p>
                        <button @click="toggleFlashcard(fc)" class="text-xs text-accent-400 hover:text-accent-300">
                            <span x-show="!fc._show">Show Answer</span>
                            <span x-show="fc._show">Hide Answer</span>
                        </button>
                        <p x-show="fc._show" class="mt-2 text-sm text-slate-400" x-text="fc.answer"></p>
                    </div>
                </template>
                <template x-if="flashcards.length === 0">
                    <p class="text-slate-500 text-sm">No flashcards for this note.</p>
                </template>
            </div>
            <div x-show="tab==='mcqs'" class="space-y-4">
                <template x-for="mcq in mcqs" :key="mcq.id">
                    <div class="card">
                        <p class="text-sm font-medium text-slate-200 mb-3" x-text="mcq.question"></p>
                        <div class="space-y-2">
                            <template x-for="(opt, i) in mcq.options" :key="i">
                                <div @click="selectAnswer(mcq, opt)"
                                     :class="{ 'correct': mcq._show && opt===mcq.correct_answer, 'incorrect': mcq._show && mcq._selected===opt && opt!==mcq.correct_answer }"
                                     class="quiz-option text-sm">
                                    <span x-text="opt"></span>
                                </div>
                            </template>
                        </div>
                        <div x-show="mcq._show" class="mt-3 text-xs text-slate-400">
                            <p><span class="text-green-400">Correct:</span> <span x-text="mcq.correct_answer"></span></p>
                            <p class="mt-1" x-text="mcq.explanation"></p>
                        </div>
                    </div>
                </template>
                <template x-if="mcqs.length === 0">
                    <p class="text-slate-500 text-sm">No MCQs for this note.</p>
                </template>
            </div>
        </div>
    </template>
</div>
{% endblock %}
