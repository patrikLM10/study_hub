{% extends "layouts/base.html" %}
{% block title %}Import - {{ app_name }}{% endblock %}
{% block content %}
<div x-data="importPage()" class="max-w-4xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white">Import Study Content</h1>
        <p class="text-slate-400 text-sm mt-1">Upload JSON from any LLM — ChatGPT, Claude, Gemini, or OpenCode</p>
    </div>

    <!-- Step indicator -->
    <div class="flex items-center gap-2 mb-8 text-sm">
        <template x-for="(s, i) in ['Upload', 'Preview', 'Import', 'Done']" :key="i">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold border-2"
                    :class="step === s.toLowerCase() ? 'bg-accent-500 border-accent-500 text-white' : ['preview','importing','done'].indexOf(step) >= i ? 'bg-accent-500/20 border-accent-500 text-accent-400' : 'border-surface-600 text-slate-500'">
                    <span x-text="i + 1"></span>
                </div>
                <span :class="step === s.toLowerCase() ? 'text-accent-400' : 'text-slate-500'" x-text="s"></span>
                <template x-if="i < 3">
                    <svg class="w-4 h-4 text-surface-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </template>
            </div>
        </template>
    </div>

    <!-- ====== STEP: UPLOAD ====== -->
    <template x-if="step === 'upload'">
        <div>
            <!-- Tab selector -->
            <div class="flex gap-1 mb-6 bg-surface-800 rounded-lg p-1 w-fit">
                <button @click="inputMode='file'" class="px-4 py-2 rounded-md text-sm font-medium transition"
                    :class="inputMode === 'file' ? 'bg-surface-700 text-white' : 'text-slate-400 hover:text-white'">Upload File</button>
                <button @click="inputMode='paste'" class="px-4 py-2 rounded-md text-sm font-medium transition"
                    :class="inputMode === 'paste' ? 'bg-surface-700 text-white' : 'text-slate-400 hover:text-white'">Paste JSON</button>
            </div>

            <!-- Upload file mode -->
            <template x-if="inputMode === 'file'">
                <div>
                    <div @dragover.prevent="dragOver=true" @dragleave.prevent="dragOver=false" @drop.prevent="handleDrop($event)"
                        class="border-2 border-dashed rounded-xl p-12 text-center transition cursor-pointer"
                        :class="dragOver ? 'border-accent-500 bg-accent-500/10' : 'border-surface-600 hover:border-surface-500'">
                        <svg class="w-12 h-12 mx-auto mb-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        <p class="text-slate-300 font-medium">Drag & drop JSON files here</p>
                        <p class="text-slate-500 text-sm mt-1">or click to browse</p>
                        <input type="file" accept=".json" multiple @change="handleFiles($event)" class="hidden" x-ref="fileInput">
                        <button @click="$refs.fileInput.click()" class="btn btn-primary mt-4">Browse Files</button>
                    </div>

                    <!-- Files list -->
                    <template x-if="files.length > 0">
                        <div class="mt-4 space-y-2">
                            <template x-for="(f, i) in files" :key="i">
                                <div class="card flex items-center justify-between py-2">
                                    <div class="flex items-center gap-2">
                                        <svg class="w-5 h-5 text-accent-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                        <span class="text-sm text-slate-300" x-text="f.name"></span>
                                        <span class="text-xs text-slate-500" x-text="(f.size / 1024).toFixed(1) + ' KB'"></span>
                                    </div>
                                    <button @click="files.splice(i, 1); if(!files.length) parsedData=null" class="text-slate-500 hover:text-red-400 transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                </div>
                            </template>
                            <button @click="parseFiles()" class="btn btn-primary w-full mt-2">
                                Parse & Preview Files
                            </button>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Paste JSON mode -->
            <template x-if="inputMode === 'paste'">
                <div>
                    <textarea x-model="pasteText" @input="validationErrors=[];parsedData=null"
                        class="w-full h-64 bg-surface-800 border border-surface-600 rounded-xl p-4 text-sm text-slate-200 font-mono focus:outline-none focus:border-accent-500 transition resize-y"
                        placeholder='Paste your JSON here...&#10;&#10;Example:&#10;{&#10;  "note_title": "Signal Classification",&#10;  "note_slug": "signal-classification",&#10;  "tags": ["signals", "gate"],&#10;  "flashcards": [...],&#10;  "mcqs": [...]&#10;}'></textarea>
                    <div class="flex gap-2 mt-4">
                        <button @click="parsePaste()" :disabled="!pasteText.trim()" class="btn btn-primary"
                            :class="{'opacity-50': !pasteText.trim()}">Validate & Preview</button>
                        <button @click="pasteText='';validationErrors=[];parsedData=null" class="btn btn-secondary">Clear</button>
                    </div>
                </div>
            </template>

            <!-- Validation errors -->
            <template x-if="validationErrors.length > 0">
                <div class="mt-6 bg-red-900/30 border border-red-800 rounded-xl p-4">
                    <h3 class="text-red-400 font-medium mb-2">Validation Errors</h3>
                    <ul class="space-y-1">
                        <template x-for="(err, i) in validationErrors" :key="i">
                            <li class="text-sm text-red-300 flex items-start gap-2">
                                <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                <span x-text="err"></span>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
        </div>
    </template>

    <!-- ====== STEP: PREVIEW ====== -->
    <template x-if="step === 'preview'">
        <div>
            <!-- Summary card -->
            <div class="card mb-6">
                <div class="flex items-start justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-white" x-text="parsedData.note_title || 'Untitled'"></h2>
                        <p class="text-sm text-slate-400 mt-1">
                            Slug: <span class="text-slate-500" x-text="parsedData.note_slug || 'auto'"></span>
                            <template x-if="parsedData.tags && parsedData.tags.length">
                                <span class="ml-3">Tags: <template x-for="t in parsedData.tags"><span class="tag text-xs" x-text="t"></span></template></span>
                            </template>
                        </p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 mt-4">
                    <template x-for="(count, type) in contentSummary" :key="type">
                        <div class="bg-surface-800 rounded-lg px-3 py-1.5 text-sm">
                            <span class="text-accent-400 font-bold" x-text="count"></span>
                            <span class="text-slate-400 ml-1" x-text="type.replace(/_/g, ' ')"></span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Content preview sections -->
            <div class="space-y-4">
                <!-- Note content preview -->
                <template x-if="parsedData.content">
                    <div class="card" x-data="{ open: true }">
                        <button @click="open=!open" class="flex items-center justify-between w-full">
                            <h3 class="text-md font-semibold text-white">Note Content</h3>
                            <svg class="w-5 h-5 text-slate-400 transition" :class="{'rotate-180': open}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <template x-if="open">
                            <div class="mt-3 prose prose-invert max-w-none text-sm text-slate-300" x-html="renderMarkdown(parsedData.content)"></div>
                        </template>
                    </div>
                </template>

                <!-- Flashcards preview -->
                <template x-if="parsedData.flashcards && parsedData.flashcards.length">
                    <div class="card" x-data="{ open: false }">
                        <button @click="open=!open" class="flex items-center justify-between w-full">
                            <h3 class="text-md font-semibold text-white">Flashcards <span class="text-accent-400" x-text="'(' + parsedData.flashcards.length + ')'"></span></h3>
                            <svg class="w-5 h-5 text-slate-400 transition" :class="{'rotate-180': open}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <template x-if="open">
                            <div class="mt-3 space-y-2">
                                <template x-for="(fc, i) in parsedData.flashcards.slice(0,10)" :key="i">
                                    <div class="bg-surface-800 rounded-lg p-3">
                                        <p class="text-sm font-medium text-slate-200"><span class="text-accent-400" x-text="'Q' + (i+1) + ': '"></span><span x-text="fc.question"></span></p>
                                        <p class="text-sm text-slate-400 mt-1"><span class="text-green-400">A: </span><span x-text="fc.answer"></span></p>
                                        <div class="flex gap-2 mt-1">
                                            <template x-if="fc.difficulty"><span class="text-xs text-slate-500" x-text="fc.difficulty"></span></template>
                                            <template x-for="t in (fc.tags || [])"><span class="tag text-xs" x-text="t"></span></template>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="parsedData.flashcards.length > 10">
                                    <p class="text-sm text-slate-500 text-center">...and <span x-text="parsedData.flashcards.length - 10"></span> more</p>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- MCQs preview -->
                <template x-if="parsedData.mcqs && parsedData.mcqs.length">
                    <div class="card" x-data="{ open: false }">
                        <button @click="open=!open" class="flex items-center justify-between w-full">
                            <h3 class="text-md font-semibold text-white">MCQs <span class="text-accent-400" x-text="'(' + parsedData.mcqs.length + ')'"></span></h3>
                            <svg class="w-5 h-5 text-slate-400 transition" :class="{'rotate-180': open}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <template x-if="open">
                            <div class="mt-3 space-y-3">
                                <template x-for="(mcq, i) in parsedData.mcqs.slice(0,5)" :key="i">
                                    <div class="bg-surface-800 rounded-lg p-3">
                                        <p class="text-sm font-medium text-slate-200" x-text="'Q' + (i+1) + ': ' + mcq.question"></p>
                                        <div class="mt-2 space-y-1">
                                            <template x-for="(opt, oi) in mcq.options" :key="oi">
                                                <div class="flex items-center gap-2 text-sm px-3 py-1.5 rounded-md"
                                                    :class="opt === mcq.correct_answer ? 'bg-green-900/30 text-green-300 border border-green-800' : 'text-slate-400'">
                                                    <span x-text="String.fromCharCode(65 + oi) + '.'"></span>
                                                    <span x-text="opt"></span>
                                                    <template x-if="opt === mcq.correct_answer">
                                                        <svg class="w-4 h-4 text-green-400 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                        <template x-if="mcq.explanation">
                                            <p class="text-xs text-slate-500 mt-2 italic" x-text="mcq.explanation"></p>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="parsedData.mcqs.length > 5">
                                    <p class="text-sm text-slate-500 text-center">...and <span x-text="parsedData.mcqs.length - 5"></span> more</p>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- MSQs preview -->
                <template x-if="parsedData.msqs && parsedData.msqs.length">
                    <div class="card" x-data="{ open: false }">
                        <button @click="open=!open" class="flex items-center justify-between w-full">
                            <h3 class="text-md font-semibold text-white">MSQs <span class="text-accent-400" x-text="'(' + parsedData.msqs.length + ')'"></span></h3>
                            <svg class="w-5 h-5 text-slate-400 transition" :class="{'rotate-180': open}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <template x-if="open">
                            <div class="mt-3 space-y-3">
                                <template x-for="(msq, i) in parsedData.msqs.slice(0,5)" :key="i">
                                    <div class="bg-surface-800 rounded-lg p-3">
                                        <p class="text-sm font-medium text-slate-200" x-text="'Q' + (i+1) + ': ' + msq.question"></p>
                                        <div class="mt-2 space-y-1">
                                            <template x-for="(opt, oi) in msq.options" :key="oi">
                                                <div class="flex items-center gap-2 text-sm px-3 py-1.5 rounded-md"
                                                    :class="msq.correct_answers && msq.correct_answers.includes(opt) ? 'bg-green-900/30 text-green-300 border border-green-800' : 'text-slate-400'">
                                                    <span x-text="String.fromCharCode(65 + oi) + '.'"></span>
                                                    <span x-text="opt"></span>
                                                    <template x-if="msq.correct_answers && msq.correct_answers.includes(opt)">
                                                        <svg class="w-4 h-4 text-green-400 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- NAT Questions preview -->
                <template x-if="parsedData.nat_questions && parsedData.nat_questions.length">
                    <div class="card" x-data="{ open: false }">
                        <button @click="open=!open" class="flex items-center justify-between w-full">
                            <h3 class="text-md font-semibold text-white">NAT Questions <span class="text-accent-400" x-text="'(' + parsedData.nat_questions.length + ')'"></span></h3>
                            <svg class="w-5 h-5 text-slate-400 transition" :class="{'rotate-180': open}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <template x-if="open">
                            <div class="mt-3 space-y-2">
                                <template x-for="(nat, i) in parsedData.nat_questions.slice(0,5)" :key="i">
                                    <div class="bg-surface-800 rounded-lg p-3">
                                        <p class="text-sm font-medium text-slate-200" x-text="'Q' + (i+1) + ': ' + nat.question"></p>
                                        <p class="text-sm text-green-400 mt-1">Answer: <span x-text="nat.answer"></span><template x-if="nat.unit"> <span x-text="nat.unit"></span></template></p>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Mindmaps preview with Mermaid -->
                <template x-if="parsedData.mindmaps && parsedData.mindmaps.length">
                    <div class="card" x-data="{ open: false }" x-init="mermaidInit()">
                        <button @click="open=!open" class="flex items-center justify-between w-full">
                            <h3 class="text-md font-semibold text-white">Mindmaps <span class="text-accent-400" x-text="'(' + parsedData.mindmaps.length + ')'"></span></h3>
                            <svg class="w-5 h-5 text-slate-400 transition" :class="{'rotate-180': open}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <template x-if="open">
                            <div class="mt-3 space-y-4">
                                <template x-for="(mm, i) in parsedData.mindmaps" :key="i">
                                    <div>
                                        <div class="mermaid" x-html="mm.mermaid_syntax"></div>
                                        <pre class="text-xs text-slate-500 mt-2 p-2 bg-surface-900 rounded overflow-x-auto" x-text="mm.mermaid_syntax"></pre>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Quizzes preview -->
                <template x-if="parsedData.quizzes && parsedData.quizzes.length">
                    <div class="card" x-data="{ open: false }">
                        <button @click="open=!open" class="flex items-center justify-between w-full">
                            <h3 class="text-md font-semibold text-white">Quizzes <span class="text-accent-400" x-text="'(' + parsedData.quizzes.length + ')'"></span></h3>
                            <svg class="w-5 h-5 text-slate-400 transition" :class="{'rotate-180': open}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <template x-if="open">
                            <div class="mt-3 space-y-3">
                                <template x-for="(qz, i) in parsedData.quizzes" :key="i">
                                    <div class="bg-surface-800 rounded-lg p-3">
                                        <p class="font-medium text-slate-200" x-text="qz.title"></p>
                                        <p class="text-xs text-slate-500 mt-1" x-text="qz.questions ? qz.questions.length + ' questions' : '0 questions'"></p>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Other content types summaries -->
                <template x-for="type in ['summaries','revision_notes','formula_sheets','cheat_sheets','interview_questions','viva_questions']" :key="type">
                    <template x-if="parsedData[type] && parsedData[type].length">
                        <div class="card" x-data="{ open: false }">
                            <button @click="open=!open" class="flex items-center justify-between w-full">
                                <h3 class="text-md font-semibold text-white capitalize" x-text="type.replace(/_/g, ' ') + ' (' + parsedData[type].length + ')'"></h3>
                                <svg class="w-5 h-5 text-slate-400 transition" :class="{'rotate-180': open}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                            </button>
                            <template x-if="open">
                                <div class="mt-3 space-y-2">
                                    <template x-for="(item, idx) in parsedData[type].slice(0,5)" :key="idx">
                                        <div class="bg-surface-800 rounded-lg p-3 text-sm text-slate-300">
                                            <template x-if="item.content">
                                                <p x-text="item.content.length > 200 ? item.content.slice(0,200) + '...' : item.content"></p>
                                            </template>
                                            <template x-if="item.question">
                                                <p><span class="text-accent-400">Q: </span><span x-text="item.question"></span></p>
                                            </template>
                                            <template x-if="item.answer">
                                                <p class="text-green-400"><span>A: </span><span x-text="item.answer"></span></p>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>
            </div>

            <!-- Import controls -->
            <div class="card mt-6">
                <div class="flex items-center gap-4 flex-wrap">
                    <div>
                        <label class="text-sm text-slate-400 block mb-1">Import Mode</label>
                        <select x-model="importMode" class="bg-surface-800 border border-surface-600 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-accent-500">
                            <option value="replace">Replace existing</option>
                            <option value="skip">Skip if exists</option>
                            <option value="merge">Merge with existing</option>
                            <option value="append">Append new content</option>
                        </select>
                    </div>
                    <div class="flex-1"></div>
                    <button @click="doImport()" class="btn btn-primary">
                        <svg class="w-5 h-5 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        Import to Supabase
                    </button>
                    <button @click="step='upload';parsedData=null" class="btn btn-secondary">Back</button>
                </div>
            </div>
        </div>
    </template>

    <!-- ====== STEP: IMPORTING ====== -->
    <template x-if="step === 'importing'">
        <div class="card text-center py-12">
            <svg class="w-12 h-12 mx-auto mb-4 text-accent-400 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <h2 class="text-lg font-semibold text-white">Importing...</h2>
            <p class="text-sm text-slate-400 mt-1">Uploading content to Supabase</p>
            <div class="mt-4 max-w-md mx-auto">
                <div class="h-2 bg-surface-800 rounded-full overflow-hidden">
                    <div class="h-full bg-accent-500 rounded-full transition-all duration-500" :style="'width: ' + progress + '%'"></div>
                </div>
                <p class="text-xs text-slate-500 mt-2" x-text="progressText"></p>
            </div>
        </div>
    </template>

    <!-- ====== STEP: DONE ====== -->
    <template x-if="step === 'done'">
        <div>
            <template x-if="importResult && importResult.success">
                <div>
                    <div class="card text-center py-8 border-green-800 bg-green-900/20">
                        <svg class="w-16 h-16 mx-auto mb-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <h2 class="text-xl font-bold text-white">Import Successful!</h2>
                        <p class="text-slate-400 mt-1" x-text="importResult.note_title"></p>
                    </div>

                    <!-- Stats -->
                    <div class="card mt-4">
                        <h3 class="text-md font-semibold text-white mb-3">Import Statistics</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                            <template x-for="(count, type) in importResult.stats" :key="type">
                                <div class="bg-surface-800 rounded-lg p-3 text-center">
                                    <p class="text-2xl font-bold text-accent-400" x-text="count"></p>
                                    <p class="text-xs text-slate-400 capitalize" x-text="type.replace(/_/g, ' ')"></p>
                                </div>
                            </template>
                        </div>
                        <template x-if="importResult.errors && importResult.errors.length">
                            <div class="mt-4 bg-yellow-900/30 border border-yellow-800 rounded-lg p-3">
                                <p class="text-yellow-400 text-sm font-medium">Warnings</p>
                                <template x-for="(err, i) in importResult.errors" :key="i">
                                    <p class="text-xs text-yellow-300 mt-1" x-text="err.message || err.detail"></p>
                                </template>
                            </div>
                        </template>
                    </div>

                    <div class="flex gap-3 mt-6">
                        <a :href="'/notes/' + importResult.note_id" class="btn btn-primary">
                            <svg class="w-5 h-5 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                            View Note
                        </a>
                        <button @click="resetImport()" class="btn btn-secondary">Import Another</button>
                    </div>
                </div>
            </template>

            <template x-if="importResult && !importResult.success">
                <div>
                    <div class="card text-center py-8 border-red-800 bg-red-900/20">
                        <svg class="w-16 h-16 mx-auto mb-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                        <h2 class="text-xl font-bold text-white">Import Failed</h2>
                    </div>
                    <div class="card mt-4">
                        <h3 class="text-md font-semibold text-white mb-2">Errors</h3>
                        <template x-for="(err, i) in importResult.errors" :key="i">
                            <div class="bg-red-900/30 border border-red-800 rounded-lg p-3 mb-2 text-sm text-red-300">
                                <p><strong x-text="err.type || 'error'"></strong>: <span x-text="err.detail || err.message"></span></p>
                            </div>
                        </template>
                    </div>
                    <button @click="resetImport()" class="btn btn-secondary mt-6">Try Again</button>
                </div>
            </template>
        </div>
    </template>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked@5/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener('alpine:init', function () {
    Alpine.data('importPage', function () {
        return {
            step: 'upload',
            inputMode: 'file',
            dragOver: false,
            files: [],
            pasteText: '',
            parsedData: null,
            validationErrors: [],
            importMode: 'replace',
            progress: 0,
            progressText: '',
            importResult: null,

            handleFiles(evt) {
                for (var f of evt.target.files) {
                    if (f.name.endsWith('.json')) this.files.push(f);
                }
            },

            handleDrop(evt) {
                this.dragOver = false;
                for (var f of evt.dataTransfer.files) {
                    if (f.name.endsWith('.json')) this.files.push(f);
                }
            },

            async parseFiles() {
                this.validationErrors = [];
                var combined = [];
                for (var f of this.files) {
                    try {
                        var text = await f.text();
                        var data = JSON.parse(text);
                        if (Array.isArray(data)) {
                            combined = combined.concat(data);
                        } else {
                            combined.push(data);
                        }
                    } catch (e) {
                        this.validationErrors.push('File "' + f.name + '": ' + e.message);
                    }
                }
                if (combined.length === 0) return;
                if (combined.length === 1) {
                    this.parsedData = this.validateData(combined[0]);
                } else {
                    this.parsedData = this.validateData(this.mergeItems(combined));
                }
                if (!this.validationErrors.length) this.step = 'preview';
            },

            parsePaste() {
                this.validationErrors = [];
                this.files = [];
                try {
                    var data = JSON.parse(this.pasteText);
                    if (Array.isArray(data)) {
                        this.parsedData = this.validateData(this.mergeItems(data));
                    } else {
                        this.parsedData = this.validateData(data);
                    }
                } catch (e) {
                    this.validationErrors.push('Invalid JSON: ' + e.message);
                    return;
                }
                if (!this.validationErrors.length) this.step = 'preview';
            },

            validateData(data) {
                if (!data.note_title && !data.title) {
                    this.validationErrors.push('Missing "note_title" (or "title") — this is required.');
                }
                if (data.flashcards && !Array.isArray(data.flashcards)) {
                    this.validationErrors.push('"flashcards" must be an array.');
                }
                if (data.mcqs && !Array.isArray(data.mcqs)) {
                    this.validationErrors.push('"mcqs" must be an array.');
                }
                var validTypes = ['note_title','note_slug','folder_path','tags','content','content_html','frontmatter',
                    'flashcards','mcqs','msqs','nat_questions','summaries','revision_notes','formula_sheets',
                    'cheat_sheets','interview_questions','viva_questions','concept_explanations','memory_tricks',
                    'real_world_examples','mindmaps','quizzes','title','slug'];
                for (var key in data) {
                    if (validTypes.indexOf(key) === -1 && !key.startsWith('_')) {
                        // Unknown field — warn but don't fail
                        console.warn('Unknown field in import JSON:', key);
                    }
                }
                return data;
            },

            mergeItems(items) {
                var merged = {};
                for (var item of items) {
                    if (item.note_title) merged.note_title = item.note_title;
                    else if (item.title) merged.note_title = item.title;
                    if (item.note_slug) merged.note_slug = item.note_slug;
                    if (item.folder_path) merged.folder_path = item.folder_path;
                    if (item.content) merged.content = (merged.content || '') + '\n\n' + item.content;
                    if (item.tags) merged.tags = [...new Set((merged.tags || []).concat(item.tags))];
                    var contentTypes = ['flashcards','mcqs','msqs','nat_questions','summaries','revision_notes',
                        'formula_sheets','cheat_sheets','interview_questions','viva_questions',
                        'concept_explanations','memory_tricks','real_world_examples','mindmaps','quizzes'];
                    for (var type of contentTypes) {
                        if (item[type]) {
                            if (!merged[type]) merged[type] = [];
                            merged[type] = merged[type].concat(item[type]);
                        }
                    }
                }
                return merged;
            },

            get contentSummary() {
                if (!this.parsedData) return {};
                var summary = {};
                var types = ['flashcards','mcqs','msqs','nat_questions','summaries','revision_notes',
                    'formula_sheets','cheat_sheets','interview_questions','viva_questions',
                    'mindmaps','quizzes'];
                for (var t of types) {
                    if (this.parsedData[t] && this.parsedData[t].length) {
                        summary[t] = this.parsedData[t].length;
                    }
                }
                return summary;
            },

            renderMarkdown(text) {
                if (!text) return '';
                if (typeof marked !== 'undefined' && marked.parse) {
                    return marked.parse(text);
                }
                return '<pre class="text-sm whitespace-pre-wrap">' + text.replace(/</g, '&lt;') + '</pre>';
            },

            mermaidInit() {
                if (typeof mermaid !== 'undefined') {
                    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
                }
            },

            async doImport() {
                this.step = 'importing';
                this.progress = 10;
                this.progressText = 'Sending data to server...';
                this.importResult = null;

                try {
                    var resp = await fetch('/api/import', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            data: this.parsedData,
                            mode: this.importMode
                        })
                    });
                    this.progress = 80;
                    this.progressText = 'Processing response...';
                    var result = await resp.json();
                    this.progress = 100;
                    this.progressText = 'Done!';
                    this.importResult = result;
                    this.step = 'done';
                } catch (e) {
                    this.importResult = {
                        success: false,
                        errors: [{ type: 'exception', detail: e.message }]
                    };
                    this.step = 'done';
                }

                if (typeof mermaid !== 'undefined') {
                    mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
                }
            },

            resetImport() {
                this.step = 'upload';
                this.files = [];
                this.pasteText = '';
                this.parsedData = null;
                this.validationErrors = [];
                this.importResult = null;
                this.progress = 0;
            }
        };
    });
});
</script>
{% endblock %}
