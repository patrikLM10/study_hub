{% extends "layouts/base.html" %}
{% block title %}Take Quiz - {{ app_name }}{% endblock %}
{% block content %}
<script>
    document.addEventListener('alpine:init', function () {
        Alpine.data('quizTake', function () {
            return {
                quiz: null,
                current: 0,
                answers: [],
                submitted: false,
                score: 0,
                loading: true,
                async init() {
                    this.pageTitle = 'Quiz';
                    if (!supabase) { this.loading = false; return; }
                    var result = await supabase.from('quizzes').select('*').eq('id', '{{ quiz_id }}').single();
                    var data = result.data;
                    this.quiz = data;
                    this.answers = new Array(data && data.questions ? data.questions.length : 0).fill(null);
                    this.loading = false;
                    Alpine.nextTick(function () { renderMath(); });
                },
                get questions() { return this.quiz && this.quiz.questions || []; },
                get currentQ() { return this.questions[this.current]; },
                select(opt) {
                    if (this.submitted) return;
                    this.answers[this.current] = opt;
                    Alpine.nextTick(function () { renderMath(); });
                },
                goTo(i) {
                    this.current = i;
                    Alpine.nextTick(function () { renderMath(); });
                },
                next() {
                    if (this.current < this.questions.length - 1) this.current++;
                    Alpine.nextTick(function () { renderMath(); });
                },
                prev() {
                    if (this.current > 0) this.current--;
                    Alpine.nextTick(function () { renderMath(); });
                },
                init() {
                    this.pageTitle = 'Quiz';
                    if (!supabase) { this.loading = false; return; }
                    var result = await supabase.from('quizzes').select('*').eq('id', '{{ quiz_id }}').single();
                    var data = result.data;
                    this.quiz = data;
                    this.answers = new Array(data && data.questions ? data.questions.length : 0).fill(null);
                    this.loading = false;
                    this._startedAt = new Date().toISOString();
                    Alpine.nextTick(function () { renderMath(); });
                },
                submit() {
                    var s = 0;
                    this.questions.forEach(function (q, i) {
                        if (this.answers[i] === q.correct_answer) s++;
                    }.bind(this));
                    this.score = s;
                    this.submitted = true;
                    if (supabase && this.quiz) {
                        var completed = new Date().toISOString();
                        supabase.from('quiz_attempts').insert({
                            quiz_id: this.quiz.id,
                            score: s,
                            total: this.questions.length,
                            answers: this.answers,
                            started_at: this._startedAt,
                            completed_at: completed,
                        }).then(function () {});
                    }
                    Alpine.nextTick(function () { renderMath(); });
                },
                get unanswered() { return this.answers.filter(function (a) { return a === null; }).length; }
            };
        });
    });
</script>
<div x-data="quizTake()" x-init="init()">
    <template x-if="loading"><p class="text-slate-400">Loading quiz...</p></template>
    <template x-if="!loading && !quiz">
        <p class="text-slate-400">Quiz not found.</p>
    </template>
    <template x-if="quiz && !submitted">
        <div class="max-w-3xl mx-auto">
            <div class="mb-6">
                <h1 class="text-xl font-bold text-white" x-text="quiz.title"></h1>
                <div class="flex items-center gap-3 mt-2 text-sm text-slate-400">
                    <span>Question <span x-text="current + 1"></span> of <span x-text="questions.length"></span></span>
                    <template x-if="quiz.time_limit">
                        <span x-text="quiz.time_limit + ' min'"></span>
                    </template>
                </div>
                <div class="flex gap-1 mt-3">
                    <template x-for="(_, i) in questions" :key="i">
                        <button @click="goTo(i)" class="w-8 h-8 rounded-lg text-xs font-medium border"
                            :class="answers[i] ? 'border-accent-500 bg-accent-500/20 text-accent-400' : 'border-surface-600 text-slate-500 hover:border-surface-500'"
                            x-text="i + 1"></button>
                    </template>
                </div>
            </div>
            <div class="card">
                <p class="text-base font-medium text-slate-200 mb-4" x-text="currentQ && currentQ.question"></p>
                <div class="space-y-2">
                    <template x-for="(opt, i) in (currentQ && currentQ.options || [])" :key="i">
                        <div @click="select(opt)"
                             :class="{ 'selected': answers[current] === opt }"
                             class="quiz-option text-sm">
                            <span x-text="opt"></span>
                        </div>
                    </template>
                </div>
            </div>
            <div class="flex justify-between mt-6">
                <button @click="prev" :disabled="current === 0" class="btn btn-secondary text-sm" :class="{ 'opacity-50': current === 0 }">Previous</button>
                <template x-if="current < questions.length - 1">
                    <button @click="next" class="btn btn-primary text-sm">Next</button>
                </template>
                <template x-if="current === questions.length - 1">
                    <button @click="submit" :disabled="unanswered > 0" class="btn btn-primary text-sm" :class="{ 'opacity-50': unanswered > 0 }">Submit (<span x-text="unanswered"></span> unanswered)</button>
                </template>
            </div>
        </div>
    </template>
    <template x-if="submitted">
        <div class="max-w-2xl mx-auto text-center">
            <div class="card">
                <h2 class="text-2xl font-bold text-white mb-2">Quiz Complete!</h2>
                <p class="text-5xl font-bold text-accent-400 mb-2"><span x-text="score + '/' + questions.length"></span></p>
                <p class="text-slate-400"><span x-text="Math.round(score / questions.length * 100) + '%'"></span></p>
            </div>
            <a href="/quizzes" class="btn btn-primary mt-6">Back to Quizzes</a>
        </div>
    </template>
</div>
{% endblock %}
