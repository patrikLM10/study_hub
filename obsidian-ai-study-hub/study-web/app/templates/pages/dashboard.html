{% extends "layouts/base.html" %}
{% block title %}Dashboard - {{ app_name }}{% endblock %}
{% block content %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('dashboard', () => ({
            stats: { notes: 0, flashcards: 0, mcqs: 0, quizzes: 0 },
            recentNotes: [],
            loading: true,
            async init() {
                this.pageTitle = 'Dashboard';
                if (!supabase) { this.loading = false; return; }
                const [notes, flashcards, mcqs, quizzes] = await Promise.all([
                    supabase.from('notes').select('id', { count: 'exact', head: true }),
                    supabase.from('flashcards').select('id', { count: 'exact', head: true }),
                    supabase.from('mcqs').select('id', { count: 'exact', head: true }),
                    supabase.from('quizzes').select('id', { count: 'exact', head: true }),
                ]);
                this.stats = { notes: notes.count || 0, flashcards: flashcards.count || 0, mcqs: mcqs.count || 0, quizzes: quizzes.count || 0 };
                const { data: recent } = await supabase.from('notes').select('id, title, slug, updated_at, tags').order('updated_at', { ascending: false }).limit(5);
                this.recentNotes = (recent || []).map(function (n) { if (typeof n.tags === 'string') n.tags = JSON.parse(n.tags); return n; });
                this.loading = false;
            }
        }));
    });
</script>
<div x-data="dashboard()" x-init="init()">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="stat-card p-4 rounded-xl bg-surface-800 border border-surface-700">
            <div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-lg bg-accent-500/10 flex items-center justify-center"><svg class="w-5 h-5 text-accent-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg></div><span class="text-sm text-slate-400">Notes</span></div>
            <p class="text-2xl font-bold text-white" x-text="stats.notes" x-show="!loading">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-surface-800 border border-surface-700">
            <div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-lg bg-green-500/10 flex items-center justify-center"><svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg></div><span class="text-sm text-slate-400">Flashcards</span></div>
            <p class="text-2xl font-bold text-white" x-text="stats.flashcards" x-show="!loading">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-surface-800 border border-surface-700">
            <div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-lg bg-amber-500/10 flex items-center justify-center"><svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg></div><span class="text-sm text-slate-400">MCQs</span></div>
            <p class="text-2xl font-bold text-white" x-text="stats.mcqs" x-show="!loading">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-surface-800 border border-surface-700">
            <div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-lg bg-rose-500/10 flex items-center justify-center"><svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg></div><span class="text-sm text-slate-400">Quizzes</span></div>
            <p class="text-2xl font-bold text-white" x-text="stats.quizzes" x-show="!loading">0</p>
        </div>
    </div>

    <div class="card">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-white">Recent Notes</h2>
            <a href="/notes" class="text-sm text-accent-400 hover:text-accent-300">View all</a>
        </div>
        <template x-if="loading">
            <p class="text-slate-400 text-sm">Loading...</p>
        </template>
        <template x-if="!loading && recentNotes.length === 0">
            <div class="text-center py-8 text-slate-400">
                <p class="text-sm">No notes yet. Use OpenCode to generate study content from your Obsidian vault.</p>
            </div>
        </template>
        <div class="space-y-2">
            <template x-for="note in recentNotes" :key="note.id">
                <a :href="'/notes/' + note.id" class="flex items-center justify-between p-3 rounded-lg hover:bg-surface-800 transition-colors">
                    <div>
                        <p class="text-sm font-medium text-slate-200" x-text="note.title"></p>
                        <div class="flex gap-1 mt-1">
                            <template x-for="tag in (note.tags || [])" :key="tag">
                                <span class="tag" x-text="tag"></span>
                            </template>
                        </div>
                    </div>
                    <span class="text-xs text-slate-500" x-text="timeAgo(note.updated_at)"></span>
                </a>
            </template>
        </div>
    </div>
</div>
{% endblock %}
