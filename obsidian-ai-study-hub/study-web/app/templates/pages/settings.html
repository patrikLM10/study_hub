{% extends "layouts/base.html" %}
{% block title %}Settings - {{ app_name }}{% endblock %}
{% block content %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('settingsPage', () => ({
            loading: true,
            settings: { daily_goal: 20, theme: 'dark' },
            async init() {
                this.pageTitle = 'Settings';
                if (!supabase) { this.loading = false; return; }
                var user = Alpine.$data(document.getElementById('app-shell') || document.body).user;
                if (user) {
                    var result = await supabase.from('settings').select('*').eq('user_id', user.id).single();
                    if (result.data) this.settings = result.data;
                }
                this.loading = false;
            },
            async save() {
                if (!supabase) return;
                var user = Alpine.$data(document.getElementById('app-shell') || document.body).user;
                if (user) {
                    await supabase.from('settings').upsert({ user_id: user.id, ...this.settings });
                }
            }
        }));
    });
</script>
<div x-data="settingsPage()" x-init="init()">
    <h2 class="text-xl font-semibold text-white mb-6">Settings</h2>
    <div class="card max-w-xl">
        <div class="space-y-4">
            <div>
                <label class="text-sm text-slate-400 block mb-1">Daily Goal (cards)</label>
                <input type="number" x-model="settings.daily_goal" class="w-full bg-surface-800 border border-surface-700 rounded-lg px-3 py-2 text-sm text-slate-200">
            </div>
            <div>
                <label class="text-sm text-slate-400 block mb-1">Theme</label>
                <select x-model="settings.theme" class="w-full bg-surface-800 border border-surface-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>
            <button @click="save" class="btn btn-primary">Save Settings</button>
        </div>
    </div>
</div>
{% endblock %}
