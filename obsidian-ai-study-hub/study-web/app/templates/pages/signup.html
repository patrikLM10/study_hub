{% extends "layouts/base.html" %}
{% block title %}Sign Up - {{ app_name }}{% endblock %}
{% block content %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('signupPage', () => ({
            email: '',
            password: '',
            name: '',
            error: '',
            loading: false,
            async signup() {
                if (!supabase) return;
                this.loading = true;
                this.error = '';
                const { error } = await supabase.auth.signUp({
                    email: this.email,
                    password: this.password,
                    options: { data: { name: this.name } }
                });
                if (error) this.error = error.message;
                else window.location.href = '/';
                this.loading = false;
            }
        }));
    });
</script>
<div class="max-w-sm mx-auto mt-12" x-data="signupPage()">
    <div class="card">
        <h2 class="text-xl font-bold text-white mb-6 text-center">Create Account</h2>
        <template x-if="error">
            <p class="text-red-400 text-sm mb-4" x-text="error"></p>
        </template>
        <div class="space-y-4">
            <input type="text" x-model="name" placeholder="Name" class="w-full bg-surface-800 border border-surface-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-accent-500">
            <input type="email" x-model="email" placeholder="Email" class="w-full bg-surface-800 border border-surface-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-accent-500">
            <input type="password" x-model="password" placeholder="Password" class="w-full bg-surface-800 border border-surface-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-accent-500">
            <button @click="signup" :disabled="loading" class="btn btn-primary w-full justify-center">Create Account</button>
            <p class="text-center text-sm text-slate-500">Already have an account? <a href="/login" class="text-accent-400 hover:text-accent-300">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}
